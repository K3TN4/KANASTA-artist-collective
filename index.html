<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KANASTA — artist collective</title>

    <!-- Libre Bodoni -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #ffffff;
            color: #111111;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* HEADER */

        header {
            padding: 28px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 17px;
            font-weight: 400;
            letter-spacing: 0.12em;
        }

        .menu {
            font-size: 12px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            cursor: pointer;
        }

        /* MAIN */

        main {
            min-height: calc(100vh - 80px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        h1 {
            font-family: "Libre Bodoni", serif;
            font-size: clamp(64px, 12vw, 180px);
            font-weight: 400;
            letter-spacing: 0.08em;
            line-height: 0.9;
            text-align: center;
        }

        .subtitle {
            margin-top: 20px;
            font-size: 12px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #666666;
        }

        .black-box {
            width: min(500px, 70vw);
            height: min(500px, 45vh);
            background: #000000;
            margin-top: 70px;
        }

        /* FOOTER */

        footer {
            padding: 28px 32px;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        /* MENU OVERLAY */

        .menu-overlay {
            position: fixed;
            inset: 0;
            background: #ffffff;
            z-index: 1000;
            display: none;
            padding: 28px 32px;
        }

        .menu-overlay.active {
            display: block;
        }

        .menu-close {
            position: absolute;
            top: 28px;
            right: 32px;
            font-size: 12px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            cursor: pointer;
        }

        .menu-list {
            margin-top: 18vh;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .menu-item {
            display: block;
            font-family: "Libre Bodoni", serif;
            font-size: clamp(40px, 7vw, 100px);
            font-weight: 400;
            letter-spacing: 0.01em;
            text-decoration: none;
            color: #111111;
            cursor: pointer;
        }

        .menu-number {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 10px;
            letter-spacing: 0.1em;
            vertical-align: middle;
            margin-right: 18px;
        }

    </style>
</head>

<body>

    <!-- HEADER -->

    <header>
        <div class="logo">KANASTA</div>

        <div class="menu" id="menuButton">
            MENU
        </div>
    </header>


    <!-- MENU -->

    <div class="menu-overlay" id="menuOverlay">

        <div class="menu-close" id="menuClose">
            CLOSE
        </div>

        <nav class="menu-list">

            <a class="menu-item" href="#artists">
                <span class="menu-number">01</span>
                ARTISTS
            </a>

            <a class="menu-item" href="#works">
                <span class="menu-number">02</span>
                WORKS
            </a>

            <a class="menu-item" href="#exhibitions">
                <span class="menu-number">03</span>
                EXHIBITIONS
            </a>

            <a class="menu-item" href="#about">
                <span class="menu-number">04</span>
                ABOUT
            </a>

            <a class="menu-item" href="#contact">
                <span class="menu-number">05</span>
                CONTACT
            </a>

        </nav>

    </div>


    <!-- MAIN -->

    <main>

        <h1>KANASTA</h1>

        <div class="subtitle">
            artist collective · Poland
        </div>

        <div class="black-box"></div>

    </main>


    <!-- FOOTER -->

    <footer>
        <span>15 artists</span>
        <span>2026</span>
    </footer>


    <!-- JAVASCRIPT -->

    <script>

        const menuButton = document.getElementById("menuButton");
        const menuOverlay = document.getElementById("menuOverlay");
        const menuClose = document.getElementById("menuClose");

        menuButton.addEventListener("click", function() {
            menuOverlay.classList.add("active");
        });

        menuClose.addEventListener("click", function() {
            menuOverlay.classList.remove("active");
        });

    </script>

</body>
</html>
