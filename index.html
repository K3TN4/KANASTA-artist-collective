<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KANASTA — artist collective</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #ffffff;
            color: #111111;
            font-family: Arial, Helvetica, sans-serif;
        }

        header {
            padding: 28px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 0.12em;
        }

        .menu {
            font-size: 12px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        main {
            min-height: calc(100vh - 80px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        h1 {
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(64px, 12vw, 180px);
            font-weight: 400;
            letter-spacing: -0.04em;
        }

        .subtitle {
            margin-top: 20px;
            font-size: 12px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #666666;
        }

        .black-box {
            width: min(500px, 70vw);
            height: min(500px, 45vh);
            background: #000000;
            margin-top: 70px;
        }

        footer {
            padding: 28px 32px;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">KANASTA</div>
        <div class="menu">MENU</div>
    </header>

    <main>
        <h1>KANASTA</h1>

        <div class="subtitle">
            artist collective · Poland
        </div>

        <div class="black-box"></div>
    </main>

    <footer>
        <span>15 artists</span>
        <span>2026</span>
    </footer>

</body>
</html>
